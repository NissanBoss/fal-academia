# Configuración del servidor de la academia.
#
# Va como proyecto de Cloudflare Pages y no como Worker suelto, aunque lo
# único que sirve sea una API. El motivo es el dominio: un Worker con nombre
# propio exige que fal-lang.org entero esté gestionado por Cloudflare, con
# los nameservers cambiados en Namecheap. Pages se conforma con un CNAME, así
# que api.fal-lang.org funciona sin mover nada de lo que ya está en marcha.
#
# Y que api cuelgue del mismo dominio que la academia no es estética: la
# sesión viaja en una cookie, y las cookies se comparten por dominio. Desde
# un nombre de otro sitio el navegador la trataría como de terceros y la
# tiraría, así que nadie podría entrar y el fallo no diría por qué.
#
# Para ponerlo en marcha, los pasos están en LEEME.md.

name = "fal-academia-api"
compatibility_date = "2026-09-01"
pages_build_output_dir = "publico"

# Quién puede llamar a este servidor. Cualquier otra página se queda sin
# respuesta utilizable, y además lo que cambie datos se rechaza de plano.
[vars]
ORIGENES = "https://aprende.fal-lang.org,https://fal-lang.org,http://localhost:8099"

[[d1_databases]]
binding = "DB"
database_name = "fal-academia"
database_id = "PEGA-AQUI-EL-QUE-TE-DE-WRANGLER"

# Sin analítica ni registros de peticiones. Lo que no se apunta no hace
# falta borrarlo después.
[observability]
enabled = false
