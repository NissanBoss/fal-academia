# Configuracion del servidor de la academia.
#
# Antes de la primera subida hay que crear la base de datos y pegar aqui el
# identificador que devuelve:
#
#   npx wrangler d1 create fal-academia
#   npx wrangler d1 execute fal-academia --remote --file=esquema.sql
#   npx wrangler deploy
#
# Y en el panel de Cloudflare, en Workers, Settings, Domains & Routes, se le
# pone el nombre api.fal-lang.org. Tiene que ser un subdominio del mismo
# dominio que la academia: la galleta de sesion se comparte por dominio, y
# desde otro nombre distinto el navegador la trataria como de terceros y la
# tiraria.

name = "fal-academia"
main = "worker.js"
compatibility_date = "2026-09-01"

# Quien puede llamar a este servidor. Cualquier otra pagina que lo intente
# se queda sin respuesta utilizable, que es lo que impide que una web
# cualquiera use la sesion de un alumno para leer o cambiar su progreso.
[vars]
ORIGENES = "https://aprende.fal-lang.org,https://fal-lang.org,http://localhost:8099"

[[d1_databases]]
binding = "DB"
database_name = "fal-academia"
database_id = "PEGA-AQUI-EL-QUE-TE-DE-WRANGLER"

# Sin analitica ni registros de peticiones. Lo que no se apunta no hace
# falta borrarlo despues.
[observability]
enabled = false
