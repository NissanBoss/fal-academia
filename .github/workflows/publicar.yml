name: Publicar la academia

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Traer el lenguaje
        uses: actions/checkout@v5
        with:
          repository: NissanBoss/Fal
          path: fal

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Compilar el intérprete a WebAssembly
        run: |
          cd fal
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o ../web/fal.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../web/
          cp docs/trabajador.js ../web/
          cd ..
          ls -lh web/fal.wasm web/wasm_exec.js web/trabajador.js

      - name: Comprobar que las lecciones siguen siendo ciertas
        run: |
          cd fal
          go build -trimpath -o ../api/fal-linux .
          cd ../web
          FAL=../api/fal-linux node comprobar-curso.mjs

      - name: El servidor de cuentas no se ha roto
        run: cd api && node pruebas.mjs

      - name: Aquí no se escribe el guion largo
        run: |
          largo=$(printf '\xe2\x80\x94')
          malos=$(grep -rln "$largo" \
            --include='*.html' --include='*.js' --include='*.mjs' \
            --include='*.sql' --include='*.md' --include='*.yml' \
            --exclude-dir=node_modules --exclude-dir=fal --exclude-dir=foro-publico \
            . || true)
          if [ -n "$malos" ]; then
            echo "Hay guion largo en:"
            grep -rn "$largo" $malos || true
            exit 1
          fi
          echo "Limpio."

      - name: Hacer el sitemap
        run: |
          curso=$(git log -1 --format=%cs -- web/curso.js 2>/dev/null || date -I)
          cat > web/sitemap.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://aprende.fal-lang.org/</loc><lastmod>$curso</lastmod><priority>1.0</priority></url>
          </urlset>
          XML
          sed -i 's/^          //' web/sitemap.xml
          cat web/sitemap.xml

      - name: Poner la política de contenidos
        run: cd web && node poner-politica.mjs index.html foro.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: desplegar
        uses: actions/deploy-pages@v4
